name: Build custom AyuGram 7.0.9

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Build type (start with Debug; use Release after Debug works)"
        required: true
        default: "Debug"
        type: choice
        options:
          - Debug
          - Release

permissions:
  contents: read

jobs:
  build:
    name: AyuGram 7.0.9 x64 (${{ inputs.configuration }})
    runs-on: windows-2022
    timeout-minutes: 360

    env:
      AYU_VERSION: "7.0.9"
      SDK_VERSION: "10.0.26100.0"
      TOOLSET_VERSION: "14.44"
      TBUILD: "C:\\TBuild"
      LIBRARIES_PATH: "C:\\TBuild\\Libraries\\win64"
      BUILD_CONFIGURATION: "${{ inputs.configuration }}"

    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout this helper repository
        uses: actions/checkout@v7

      - name: Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          architecture: "x64"

      - name: Prepare build directories
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force "$env:TBUILD" | Out-Null
          New-Item -ItemType Directory -Force "$env:TBUILD\Libraries" | Out-Null
          New-Item -ItemType Directory -Force "$env:TBUILD\ThirdParty" | Out-Null

          $archive = Join-Path $env:RUNNER_TEMP "AyuGramDesktop-$env:AYU_VERSION-full.tar.gz"
          $url = "https://github.com/AyuGram/AyuGramDesktop/releases/download/v$env:AYU_VERSION/AyuGramDesktop-$env:AYU_VERSION-full.tar.gz"

          Write-Host "Downloading official AyuGram full source archive:"
          Write-Host $url
          & curl.exe -L --fail --retry 3 --retry-delay 5 $url -o $archive
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to download AyuGram source archive."
          }

          $staging = "$env:TBUILD\source-extract"
          Remove-Item $staging -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $staging | Out-Null

          & tar.exe -xzf $archive -C $staging
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to extract AyuGram source archive."
          }

          $cmake = Get-ChildItem -Path $staging -Filter CMakeLists.txt -Recurse -File |
            Where-Object {
              $_.Directory.Name -eq "Telegram" -and
              (Test-Path (Join-Path $_.Directory.Parent.FullName "Telegram\SourceFiles"))
            } |
            Select-Object -First 1

          if (-not $cmake) {
            throw "Could not locate Telegram\CMakeLists.txt after extraction."
          }

          $sourceRoot = $cmake.Directory.Parent.FullName
          $dest = "$env:TBUILD\tdesktop"

          Remove-Item $dest -Recurse -Force -ErrorAction SilentlyContinue

          if ($sourceRoot -eq $staging) {
            Rename-Item -Path $staging -NewName "tdesktop"
          } else {
            Move-Item -Path $sourceRoot -Destination $dest
            Remove-Item $staging -Recurse -Force -ErrorAction SilentlyContinue
          }

          if (-not (Test-Path "$dest\Telegram\CMakeLists.txt")) {
            throw "Source tree layout is unexpected: $dest\Telegram\CMakeLists.txt not found."
          }

          "AYU_ROOT=$dest" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "AyuGram source root: $dest"

      - name: Check custom notification patch
        run: |
          python "%GITHUB_WORKSPACE%\apply_account_notifications_v2.py" "%AYU_ROOT%" --check

      - name: Apply custom notification patch
        run: |
          python "%GITHUB_WORKSPACE%\apply_account_notifications_v2.py" "%AYU_ROOT%"

      - name: Enable Visual Studio 2022 x64 toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          sdk: "10.0.26100.0"
          toolset: "14.44"

      - name: Show tool versions
        run: |
          python --version
          cmake --version
          cl
          echo.
          echo Disk before dependencies:
          powershell -NoProfile -Command "Get-PSDrive C | Format-Table Name,Used,Free -AutoSize"

      - name: Fix NuGet source
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages" 2>nul
          nuget sources Add -Name "nuget.org" -Source https://api.nuget.org/v3/index.json 2>nul
          exit /b 0

      - name: Restore ThirdParty cache
        uses: actions/cache@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ayugram-${{ env.AYU_VERSION }}-windows-x64-thirdparty-v1

      - name: Restore Libraries cache
        uses: actions/cache@v6
        with:
          path: ${{ env.TBUILD }}\Libraries\win64
          key: ayugram-${{ env.AYU_VERSION }}-windows-x64-libraries-v1

      - name: Prepare Telegram/AyuGram libraries
        run: |
          call "%AYU_ROOT%\Telegram\build\prepare\win.bat" skip-release silent

      - name: Free unnecessary dependency files
        shell: bash
        run: |
          find "$LibrariesPath" \
            '(' \
              '(' \
                ! '(' \
                  -name '*.lib' \
                  -o -name '*.a' \
                  -o -name '*.exe' \
                  -o -name '*.h' \
                  -o -name '*.hpp' \
                  -o -name '*.inc' \
                  -o -name '*.cmake' \
                  -o -name '*.pc' \
                  -o -path '*/include/*' \
                  -o -path '*/objects-*' \
                  -o -path '*/cache_keys/*' \
                  -o -path '*/patches/*' \
                  -o -path '*/nv-codec-headers/*' \
                ')' \
                -type f \
              ')' \
              -o -empty \
            ')' -delete

      - name: Show disk after dependencies
        shell: pwsh
        run: |
          Get-PSDrive C | Format-Table Name,Used,Free -AutoSize

      - name: Configure AyuGram
        run: |
          cd /d "%AYU_ROOT%\Telegram"
          call configure.bat x64 ^
            -D TDESKTOP_API_ID=2040 ^
            -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627 ^
            -D CMAKE_CONFIGURATION_TYPES=%BUILD_CONFIGURATION% ^
            -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON

      - name: Build AyuGram
        run: |
          cd /d "%AYU_ROOT%\Telegram"
          cmake --build ..\out --config %BUILD_CONFIGURATION% --target Telegram --parallel 4

      - name: Collect result
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $env:AYU_ROOT "out\$env:BUILD_CONFIGURATION"
          if (-not (Test-Path $out)) {
            throw "Build output directory not found: $out"
          }

          $artifact = Join-Path $env:GITHUB_WORKSPACE "artifact"
          New-Item -ItemType Directory -Force $artifact | Out-Null

          $exe = Get-ChildItem -Path $out -File -Recurse |
            Where-Object { $_.Name -in @("AyuGram.exe", "Telegram.exe") } |
            Select-Object -First 1

          if (-not $exe) {
            Write-Host "EXE files found in output:"
            Get-ChildItem -Path $out -Filter *.exe -File -Recurse | Select-Object FullName
            throw "AyuGram/Telegram executable was not found."
          }

          Copy-Item $exe.FullName (Join-Path $artifact "AyuGram.exe")

          $updater = Get-ChildItem -Path $out -Filter Updater.exe -File -Recurse |
            Select-Object -First 1
          if ($updater) {
            Copy-Item $updater.FullName (Join-Path $artifact "Updater.exe")
          }

          $sha = (Get-FileHash (Join-Path $artifact "AyuGram.exe") -Algorithm SHA256).Hash
          "$sha  AyuGram.exe" | Set-Content -Path (Join-Path $artifact "SHA256.txt") -Encoding ASCII

          @"
          AyuGram Desktop: 7.0.9
          Architecture: x64
          Configuration: $env:BUILD_CONFIGURATION
          Custom change: per-account notification switches
          Auto-update: disabled so the custom binary is not overwritten
          Source: official AyuGramDesktop v7.0.9 full release archive
          "@ | Set-Content -Path (Join-Path $artifact "BUILD-INFO.txt") -Encoding UTF8

          Get-ChildItem $artifact | Format-Table Name,Length -AutoSize

      - name: Upload AyuGram artifact
        uses: actions/upload-artifact@v7
        with:
          name: AyuGram-7.0.9-custom-${{ inputs.configuration }}-x64
          path: artifact\
          retention-days: 7
          if-no-files-found: error
